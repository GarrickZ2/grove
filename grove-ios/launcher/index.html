<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Grove</title>
  <style>
    :root { color-scheme: light dark; --bg:#ffffff; --text:#18181b; --muted:#71717a; --border:#e4e4e7; --soft:#f4f4f5; --row:#fafafa; --ink:#18181b; --on-ink:#fff; --ok:#22c55e; --off:#d4d4d8; --bad:#dc2626; --icon:var(--grove-ios-icon, url(/app-icons/pwa/classic-light-512.png)); }
    @media (prefers-color-scheme: dark) { :root { --bg:#0f1012; --text:#f4f4f5; --muted:#a1a1aa; --border:#2e3036; --soft:#1d1f23; --row:#17181b; --ink:#f4f4f5; --on-ink:#18181b; --off:#52525b; --bad:#f87171; --icon:var(--grove-ios-icon, url(/app-icons/pwa/classic-dark-512.png)); } }
    * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html, body { height:100%; }
    body { margin:0; background:var(--bg); color:var(--text); font:16px -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; -webkit-font-smoothing:antialiased;
      padding: max(16px, env(safe-area-inset-top)) calc(20px + env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) calc(20px + env(safe-area-inset-left)); }
    main { display:flex; flex-direction:column; min-height:100%; max-width:440px; margin:0 auto; }
    button, input { font:inherit; color:inherit; }
    button { cursor:pointer; }
    button:focus-visible, input:focus-visible { outline:2px solid var(--ink); outline-offset:2px; }
    [hidden] { display:none !important; }
    .pill { align-self:flex-start; display:flex; align-items:center; gap:7px; max-width:100%; height:40px; padding:0 12px; border:1px solid var(--border); border-radius:20px; background:var(--row); font-size:14px; color:var(--muted); }
    .pill span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .dot { width:8px; height:8px; flex:none; border-radius:50%; background:var(--off); }
    .dot.ok { background:var(--ok); } .dot.bad { background:var(--bad); } .dot.warn { background:#f59e0b; }
    .stage { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:22px; text-align:center; padding:24px 0; }
    .mark { width:96px; height:96px; border-radius:22px; background:var(--icon) center/cover; box-shadow:0 10px 30px rgb(0 0 0 / 10%); transition:opacity .3s; }
    .dim .mark { opacity:.45; }
    .bar { width:120px; height:3px; border-radius:2px; background:var(--soft); overflow:hidden; }
    .bar i { display:block; width:40%; height:100%; border-radius:2px; background:var(--ink); animation:load 1.1s ease-in-out infinite; }
    @keyframes load { from { transform:translateX(-100%); } to { transform:translateX(260%); } }
    #busy { display:flex; flex-direction:column; align-items:center; gap:14px; }
    .label { font-size:14px; color:var(--muted); margin:0; }
    h1 { margin:0; font-size:21px; font-weight:650; letter-spacing:-.02em; }
    .reason { margin:6px 0 0; font-size:14px; line-height:1.5; color:var(--muted); max-width:320px; }
    .actions { display:flex; flex-direction:column; gap:10px; width:100%; }
    .primary, .secondary { height:50px; border:0; border-radius:14px; font-size:16px; }
    .primary { background:var(--ink); color:var(--on-ink); font-weight:600; }
    .secondary { background:var(--soft); }
    button:disabled { opacity:.5; cursor:default; }
    .head { display:flex; align-items:center; justify-content:space-between; min-height:44px; margin:8px 0 14px; }
    .head h1 { font-size:24px; }
    .icon-button { width:44px; height:44px; display:grid; place-items:center; border:0; border-radius:22px; background:var(--soft); }
    .text-button { height:44px; padding:0 4px; border:0; background:none; color:var(--muted); font-size:16px; }
    .list { display:flex; flex-direction:column; border-radius:16px; background:var(--row); overflow:hidden; }
    .row { display:flex; align-items:center; border-bottom:1px solid var(--border); }
    .row:last-child { border-bottom:0; }
    .open { flex:1; min-width:0; display:flex; align-items:center; gap:12px; min-height:64px; padding:0 4px 0 16px; border:0; background:none; text-align:left; }
    .text { flex:1; min-width:0; display:flex; flex-direction:column; gap:2px; }
    .text b { font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .text small { font-size:13px; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .edit { width:48px; height:64px; flex:none; border:0; background:none; color:var(--muted); display:grid; place-items:center; }
    .editor { display:flex; flex-direction:column; gap:10px; padding:4px 16px 16px; }
    .field { display:flex; flex-direction:column; gap:8px; text-align:left; }
    .field span { font-size:13px; color:var(--muted); }
    .field input { height:50px; padding:0 14px; border:1px solid var(--border); border-radius:14px; background:var(--bg); font-size:16px; }
    .found { min-height:18px; font-size:13px; color:var(--muted); display:flex; align-items:center; gap:6px; }
    .danger { height:44px; border:0; background:none; color:var(--bad); font-size:15px; }
    .form { display:flex; flex-direction:column; gap:18px; }
    .grow { flex:1; min-height:24px; }
    #error { min-height:20px; margin:12px 0 0; font-size:14px; line-height:1.5; color:var(--bad); }
    @media (prefers-reduced-motion: reduce) { .bar i { animation:none; width:100%; } }
  </style>
</head>
<body>
<main>
  <!-- Opening a server: straight to it, or why it can't be reached. -->
  <section id="opening" hidden>
    <button class="pill" type="button" data-pick><i class="dot" id="opening-dot"></i><span id="opening-name"></span>
      <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M3 4.5l3 3 3-3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></button>
  </section>
  <div class="stage" id="stage" hidden>
    <div class="mark" role="img" aria-label="Grove"></div>
    <div id="busy"><div class="bar"><i></i></div><p class="label" id="busy-label">Connecting…</p></div>
    <div id="failed" hidden><h1 id="failed-title"></h1><p class="reason" id="failed-reason"></p></div>
  </div>
  <div class="actions" id="failed-actions" hidden>
    <button class="primary" type="button" id="retry">Try again</button>
    <button class="secondary" type="button" data-pick>Other servers</button>
  </div>

  <!-- The servers this app knows. -->
  <section id="servers" hidden>
    <div class="head"><h1>Servers</h1>
      <button class="icon-button" type="button" id="add" aria-label="Add a server"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M9 3v12M3 9h12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button></div>
    <div class="list" id="list"></div>
    <p id="error" role="alert"></p>
  </section>

  <!-- Adding one: the address, then sign in on the server's own page. -->
  <form id="adding" class="form" hidden novalidate>
    <div class="head"><button class="text-button" type="button" id="cancel">Cancel</button><h1 style="font-size:17px">Add a server</h1><span style="width:52px"></span></div>
    <label class="field"><span>Address</span>
      <input id="address" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="192.168.1.10:3001"></label>
    <div class="found" id="found"></div>
    <label class="field"><span>Name</span><input id="name" autocomplete="off" maxlength="80" placeholder="Optional"></label>
    <p id="add-error" role="alert" style="margin:0;font-size:14px;color:var(--bad)"></p>
    <div class="grow"></div>
    <button class="primary" type="submit" id="connect">Connect</button>
  </form>
</main>
<script id="configuration" type="application/json">__CONFIGURATION__</script>
<script>
  const config = JSON.parse(document.getElementById('configuration').textContent);
  const $ = (id) => document.getElementById(id);
  const servers = config.servers;
  const reach = new Map();

  async function call(path, body) {
    const response = await fetch(path, { method:'POST', headers:{ 'Content-Type':'application/json', 'X-Grove-Setup':config.token }, body:JSON.stringify(body || {}) });
    if (response.status === 204) return {};
    const result = await response.json().catch(() => ({}));
    if (!response.ok) throw Object.assign(new Error(result.error || 'Something went wrong.'), { signIn: result.sign_in ? result.server : null });
    return result;
  }

  // Shows the server's sign-in page and waits. The app may be left for a code
  // meanwhile, and calls fail while it is in the background: ask until there is an answer.
  async function signIn(server) {
    document.activeElement?.blur();
    const { id } = await call('/_grove/sign-in', { server });
    for (;;) {
      await new Promise((done) => setTimeout(done, 600));
      const now = await call('/_grove/sign-in/state').catch(() => null);
      if (!now || (now.id === id && now.state === 'open')) continue;
      if (now.id === id && now.state === 'done') return;
      throw new Error(now.id === id && now.error ? now.error : 'Sign-in was closed');
    }
  }
  async function connect(server, name) {
    const to = (address) => call('/_grove/connect', { server:address, name });
    const result = await to(server).catch(async (error) => {
      if (!error.signIn) throw error;
      await signIn(error.signIn);
      return to(error.signIn);
    });
    location.replace(result.location);
  }

  // Lets the address be typed the short way: 192.168.1.10 means Grove's port, a public name https.
  // Same rule as grove-web/src/ios/servers.ts.
  const isLocalHost = (host) => !host.includes('.') || /^[\d.]+$/.test(host) || host.startsWith('[') || /\.(local|lan|home|internal|arpa|ts\.net)$/i.test(host);
  function origin(value) {
    let text = value.trim();
    if (!text) return '';
    const bare = !/^https?:\/\//i.test(text);
    if (bare) text = 'http://' + text;
    try {
      const url = new URL(text);
      if (bare && !url.port) { if (isLocalHost(url.hostname)) url.port = '3001'; else url.protocol = 'https:'; }
      return url.origin;
    } catch { return text; }
  }

  function show(view) {
    for (const id of ['opening', 'stage', 'failed-actions', 'servers', 'adding']) $(id).hidden = true;
    if (view === 'opening' || view === 'failed') { $('opening').hidden = false; $('stage').hidden = false; }
    if (view === 'failed') $('failed-actions').hidden = false;
    if (view === 'servers') { $('servers').hidden = false; render(); probeAll(); }
    if (view === 'adding') { $('adding').hidden = false; $('cancel').hidden = !servers.length; $('address').focus(); }
    $('stage').classList.toggle('dim', view === 'failed');
    $('busy').hidden = view !== 'opening';
    $('failed').hidden = view !== 'failed';
  }

  let target = null;
  async function open(profile, asked) {
    target = profile;
    $('opening-name').textContent = profile.name;
    $('opening-dot').className = 'dot';
    $('busy-label').textContent = 'Connecting to ' + profile.name;
    show('opening');
    try {
      // Opened on its own at launch, a sign-in waits to be asked for.
      if (asked) await connect(profile.server, profile.name);
      else location.replace((await call('/_grove/connect', { server:profile.server, name:profile.name })).location);
    } catch (error) {
      const host = new URL(profile.server).host;
      const signing = error.signIn || /^Sign-in/.test(error.message);
      $('opening-dot').className = signing ? 'dot warn' : 'dot bad';
      $('failed-title').textContent = (signing ? 'Sign in to ' : "Can't reach ") + profile.name;
      $('failed-reason').textContent = signing ? host : host + ' — is Grove running there (grove remote), and on the same network?';
      $('retry').textContent = signing ? 'Sign in' : 'Try again';
      show('failed');
    }
  }
  $('retry').addEventListener('click', () => target && open(target, true));
  document.querySelectorAll('[data-pick]').forEach((b) => b.addEventListener('click', () => show('servers')));

  let editing = null;
  function render() {
    const list = $('list');
    list.replaceChildren();
    for (const profile of servers) {
      const row = document.createElement('div');
      row.className = 'row';
      if (editing === profile.id) {
        const editor = document.createElement('div');
        editor.className = 'editor';
        editor.innerHTML = '<label class="field"><span>Name</span><input maxlength="80"></label><button class="primary" type="button">Save</button><button class="danger" type="button">Remove this server</button>';
        const [input] = editor.getElementsByTagName('input');
        const [save, remove] = editor.getElementsByTagName('button');
        input.value = profile.name;
        save.addEventListener('click', async () => {
          try { await call('/_grove/rename', { id:profile.id, name:input.value }); profile.name = input.value.trim(); editing = null; render(); }
          catch (error) { $('error').textContent = error.message; }
        });
        remove.addEventListener('click', async () => {
          if (!confirm('Remove ' + profile.name + '? You will need to sign in again if you add it back.')) return;
          try {
            await call('/_grove/forget', { id:profile.id });
            servers.splice(servers.indexOf(profile), 1);
            editing = null;
            servers.length ? render() : show('adding');
          } catch (error) { $('error').textContent = error.message; }
        });
        row.append(editor);
        list.append(row);
        setTimeout(() => input.focus());
        continue;
      }
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'open';
      const dot = document.createElement('i');
      const state = reach.get(profile.id);
      dot.className = 'dot' + (state === 'ok' ? ' ok' : state === 'sign_in' ? ' warn' : '');
      const text = document.createElement('span'); text.className = 'text';
      const title = document.createElement('b'); title.textContent = profile.name;
      const detail = document.createElement('small');
      detail.textContent = (state === 'none' ? "Can't reach · " : state === 'sign_in' ? 'Sign in · ' : '') + new URL(profile.server).host;
      text.append(title, detail);
      button.append(dot, text);
      if (profile.id === config.current) {
        button.insertAdjacentHTML('beforeend', '<svg width="20" height="20" viewBox="0 0 20 20" aria-label="Current"><path d="M4 10.5l4 4 8-9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>');
      }
      button.addEventListener('click', () => open(profile, true));
      const edit = document.createElement('button');
      edit.type = 'button'; edit.className = 'edit'; edit.setAttribute('aria-label', 'Edit ' + profile.name);
      edit.innerHTML = '<svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><circle cx="4" cy="9" r="1.5" fill="currentColor"/><circle cx="9" cy="9" r="1.5" fill="currentColor"/><circle cx="14" cy="9" r="1.5" fill="currentColor"/></svg>';
      edit.addEventListener('click', () => { editing = profile.id; render(); });
      row.append(button, edit);
      list.append(row);
    }
  }
  function probeAll() {
    for (const profile of servers) {
      call('/_grove/probe', { server:profile.server })
        .then((result) => { reach.set(profile.id, result.reachable ? 'ok' : result.sign_in ? 'sign_in' : 'none'); if (!editing) render(); })
        .catch(() => {});
    }
  }
  $('add').addEventListener('click', () => show('adding'));
  $('cancel').addEventListener('click', () => show('servers'));

  // Check the address while it is typed, so a typo shows before Connect.
  let probing = 0;
  $('address').addEventListener('input', () => {
    const value = origin($('address').value);
    const ticket = ++probing;
    $('found').textContent = '';
    if (!value) return;
    setTimeout(async () => {
      if (ticket !== probing) return;
      $('found').innerHTML = '<i class="dot"></i>Looking for Grove…';
      const result = await call('/_grove/probe', { server:value }).catch(() => ({}));
      if (ticket !== probing) return;
      $('found').innerHTML = result.reachable ? '<i class="dot ok"></i>Found Grove' : result.sign_in ? '<i class="dot warn"></i>Found a sign-in page' : "<i class=\"dot\"></i>No Grove answers here yet";
    }, 500);
  });
  $('adding').addEventListener('submit', async (event) => {
    event.preventDefault();
    const server = origin($('address').value);
    if (!server) { $('add-error').textContent = 'Enter the address Grove shows on your computer.'; return; }
    $('connect').disabled = true;
    $('connect').textContent = 'Connecting…';
    $('add-error').textContent = '';
    try {
      await connect(server, $('name').value.trim());
    } catch (error) {
      $('add-error').textContent = error.message;
      $('connect').disabled = false;
      $('connect').textContent = 'Connect';
    }
  });

  // Launch: back to the last server, unless asked to pick another.
  const picking = new URLSearchParams(location.search).has('pick') || config.current;
  const last = servers.find((p) => p.id === config.last) || (servers.length === 1 ? servers[0] : null);
  if (!servers.length) { $('address').value = config.server || ''; show('adding'); }
  else if (last && !picking) open(last);
  else show('servers');
</script>
</body>
</html>
