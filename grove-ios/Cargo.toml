[package]
name = "grove-ios"
version = "0.12.9"
edition = "2021"
publish = false

# Keep the mobile dependency graph independent of the desktop workspace.
[workspace]

[lib]
name = "grove_ios"
crate-type = ["staticlib", "rlib"]

[features]
default = ["app"]
app = ["dep:tauri", "dep:tauri-build"]

[dependencies]
tauri = { version = "2", optional = true , features = [] }
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "fs"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "rustls-tls-native-roots"] }
futures-util = "0.3"
rust-embed = { version = "8", features = ["include-exclude", "debug-embed"] }
mime_guess = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
uuid = { version = "1", features = ["v4"] }

[build-dependencies]
tauri-build = { version = "2", optional = true , features = [] }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "grove-ios"
required-features = ["app"]
