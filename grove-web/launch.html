<!DOCTYPE html>
<html lang="en" class="grove-launch-page">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grove</title>
  </head>
  <body>
    <div class="gl-stage" aria-hidden="true">
      <div class="gl-aura"><i></i><i></i><i></i></div>
      <div class="gl-flash"></div>
      <div class="gl-ring"></div>
      <div class="gl-mark"><img src="/favicon.svg" alt="" draggable="false" /><div class="gl-sheen"></div></div>
      <div class="gl-word">Grove</div>
    </div>
    <div class="gl-status" role="status" aria-live="polite" hidden>
      <b class="gl-status-step"></b>
      <span class="gl-status-note"></span>
      <button type="button" class="gl-status-quit" hidden>Quit</button>
    </div>
    <script type="module" src="/src/launch-main.ts"></script>
  </body>
</html>
